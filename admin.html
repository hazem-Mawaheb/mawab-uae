<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<title>لوحة الإدارة</title>

https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css

</head>

<body>

<div class="container mt-5">

<h1>

لوحة المدير الرئيسي

</h1>

<hr>

<h3>
طلبات الشركات
</h3>

<table class="table">

<thead>

<tr>

<th>اسم الشركة</th>

<th>الوظيفة</th>

<th>العدد</th>

</tr>

</thead>

<tbody id="clientsBody">

</tbody>

</table>

<hr>

<h3>
المرشحون
</h3>

<table class="table">

<thead>

<tr>

<th>الاسم</th>

<th>التخصص</th>

<th>الوظيفة</th>

</tr>

</thead>

<tbody id="candidateBody">

</tbody>

</table>

</div>

<script>

let clients=
JSON.parse(
localStorage.getItem("clients")
)||[];

clients.forEach(c=>{

document
.getElementById("clientsBody")
.innerHTML +=

`<tr>
<td>${c.companyName}</td>
<td>${c.jobTitle}</td>
<td>${c.quantity}</td>
</tr>`;

});

let candidates=
JSON.parse(
localStorage.getItem("candidates")
)||[];

candidates.forEach(c=>{

document
.getElementById("candidateBody")
.innerHTML +=

`<tr>
<td>${c.fullName}</td>
<td>${c.specialization}</td>
<td>${c.targetPosition}</td>
</tr>`;

});

</script>

</body>
</html>
