<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">

<title>بوابة المرشحين</title>

https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css

</head>

<body>

<div class="container mt-5">

<h1>
بوابة الباحثين عن عمل
</h1>

<form id="candidateForm">

<input id="fullName"
class="form-control mb-3"
placeholder="الاسم">

<input id="candidateEmail"
class="form-control mb-3"
placeholder="البريد">

<input id="specialization"
class="form-control mb-3"
placeholder="التخصص">

<input id="targetPosition"
class="form-control mb-3"
placeholder="الوظيفة المطلوبة">

<button class="btn btn-success">

إرسال

</button>

</form>

</div>

<script>

document
.getElementById("candidateForm")
.addEventListener("submit",function(e){

e.preventDefault();

let candidates=
JSON.parse(
localStorage.getItem("candidates")
)||[];

candidates.push({

fullName:
document.getElementById("fullName").value,

email:
document.getElementById("candidateEmail").value,

specialization:
document.getElementById("specialization").value,

targetPosition:
document.getElementById("targetPosition").value,

created:
new Date().toLocaleString()

});

localStorage.setItem(
"candidates",
JSON.stringify(candidates)
);

alert("تم حفظ البيانات");

this.reset();

});

</script>

</body>
</html>
